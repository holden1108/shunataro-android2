name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and build web app
        run: |
          pnpm test
          pnpm build
          node scripts/prepare-android.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore personal debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shunataro-debug-key-v1
      - name: Build and lint Android app
        run: gradle -p android assembleDebug lintDebug --no-daemon
      - name: Prepare APK download
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/shunataro.apk
          sha256sum apk/shunataro.apk > apk/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: shunataro-android-apk
          path: apk/
          if-no-files-found: error
          retention-days: 30
      - name: Download instructions
        run: |
          echo '## しゅな太郎のAPKができました' >> "$GITHUB_STEP_SUMMARY"
          echo 'このページの Artifacts → shunataro-android-apk をダウンロードし、ZIPを展開して shunataro.apk をAndroidで開いてください。' >> "$GITHUB_STEP_SUMMARY"
