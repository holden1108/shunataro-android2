plugins { id 'com.android.application' }
// Convert before entering the Android DSL; avoid Groovy's ambiguous command syntax.
def buildNumberText = providers.environmentVariable('GITHUB_RUN_NUMBER').getOrElse('1')
def apkVersionCode = Integer.parseInt(buildNumberText)
if (apkVersionCode < 1 || apkVersionCode > 2100000000) {
    throw new GradleException('GITHUB_RUN_NUMBER must be between 1 and 2100000000')
}
android {
    namespace 'jp.shunataro.burrow'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.shunataro.burrow'
        minSdk 26
        targetSdk 35
        versionCode = apkVersionCode
        versionName = "1.0.${apkVersionCode}"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
